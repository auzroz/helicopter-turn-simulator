<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helicopter Turn Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Helicopter Turn Simulator</h1>
        <span class="header-subtitle">Coordinated Turn &amp; Power Analysis</span>
    </header>

    <div id="setup-bar">
        <div class="setup-group">
            <label for="helicopter-type">Helicopter</label>
            <select id="helicopter-type"></select>
        </div>
        <div class="setup-group">
            <label for="gross-weight">Weight lbs</label>
            <input type="number" id="gross-weight" value="16000" min="1000" max="50000" step="100">
        </div>
        <div class="setup-group">
            <label for="heading">Heading &deg;</label>
            <input type="number" id="heading" value="0" min="0" max="360" step="1">
        </div>
        <div class="setup-group">
            <label for="turn-direction">Turn</label>
            <select id="turn-direction">
                <option value="left">Left</option>
                <option value="right">Right</option>
            </select>
        </div>
        <div class="setup-group">
            <label for="wind-direction">Wind From &deg;</label>
            <input type="number" id="wind-direction" value="0" min="0" max="360" step="1">
        </div>
        <div class="setup-group">
            <label for="wind-speed">Wind kt</label>
            <input type="number" id="wind-speed" value="0" min="0" max="100" step="1">
        </div>
        <div class="setup-group">
            <label for="turn-radius">Radius m</label>
            <input type="number" id="turn-radius" value="500" min="50" max="5000" step="50">
        </div>
        <div class="setup-group">
            <label for="airspeed">IAS kt</label>
            <input type="number" id="airspeed" value="60" min="10" max="200" step="5">
        </div>
        <div class="setup-group">
            <label for="approach-enabled">
                <input type="checkbox" id="approach-enabled"> Approach
            </label>
        </div>
        <div class="setup-group approach-field" style="display:none">
            <label for="approach-heading">Final Hdg &deg;</label>
            <input type="number" id="approach-heading" value="180" min="0" max="360" step="1">
        </div>
        <div class="setup-group approach-field" style="display:none">
            <label for="approach-distance">Final Dist m</label>
            <input type="number" id="approach-distance" value="1000" min="200" max="5000" step="100">
        </div>
        <div class="setup-actions">
            <button id="add-simulation">Add Simulation</button>
            <button id="clear-all" class="btn-secondary">Clear All</button>
        </div>
    </div>

    <div id="main-content">
        <aside id="sim-sidebar">
            <div id="sidebar-placeholder">
                <p>No simulations running.</p>
                <p class="hint">Select a helicopter type and click <strong>Add Simulation</strong> to begin.</p>
            </div>
        </aside>
        <main id="canvas-area">
            <canvas id="simulation-canvas"></canvas>
        </main>
    </div>

    <section id="explainer-section">
        <button id="explainer-toggle" class="btn-secondary">Physics Breakdown &#9654;</button>
        <div id="explainer-content" class="collapsed"></div>
    </section>

    <script type="module" src="js/main.js"></script>
</body>
</html>
