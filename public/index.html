<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helicopter Turn Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Helicopter Turn Simulator</h1>
    <div id="simulator-container">
        <div id="controls">
            <h2>Simulator Controls</h2>
            <!-- Existing input fields -->
            <label for="weight">Helicopter Weight (pounds):</label>
            <input type="number" id="weight" value="13228" min="0">

            <label for="heading">Aircraft Heading at Turn Entry (degrees):</label>
            <input type="number" id="heading" value="0" min="0" max="360">

            <label for="wind-direction">Wind Direction (degrees from which wind is coming):</label>
            <input type="number" id="wind-direction" value="0" min="0" max="360">

            <label for="wind-speed">Wind Speed (knots):</label>
            <input type="number" id="wind-speed" value="0" min="0">

            <label for="turn-radius">Desired Turn Radius (m):</label>
            <input type="number" id="turn-radius" value="1000" min="0">

            <label for="ground-speed">Ground Speed (knots):</label>
            <input type="number" id="ground-speed" value="50" min="0">

            <button id="start-simulation">Start Simulation</button>
        </div>

        <div id="simulation">
            <canvas id="simulation-canvas" width="800" height="800"></canvas>
            <div id="data-display">
                <p><strong>Bank Angle:</strong> <span id="bank-angle">0</span>°</p>
                <p><strong>Power Required:</strong> <span id="power-required">0</span> W</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
